<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>테니스 토너먼트 매니저</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>테니스 토너먼트 매니저</h1>
      <p class="muted">관리자: 선수 등록 → 대진 생성 → 결과 입력 → 자동 진행</p>
      <div id="appStatus" class="app-status">앱 로딩 중...</div>
    </div>
  </header>

  <main class="container app">
    <section class="panel">
      <h2>선수 등록</h2>
      <div class="inline-row">
        <input id="playerName" type="text" placeholder="선수 이름을 입력하세요" />
        <button id="addPlayer">선수 추가</button>
        <button id="clearPlayers">초기화</button>
      </div>
      <div id="playersList" class="players-list" aria-live="polite"></div>
      <div class="controls">
        <label for="bracketSize">대진 크기:</label>
        <select id="bracketSize"><option>4</option><option>8</option><option>16</option></select>
        <button id="generateBracket" class="primary">대진 생성</button>
      </div>
    </section>

    <section class="panel">
      <h2>대진표</h2>
      <div id="bracketContainer" class="bracket-container">대진이 없습니다. 선수 수를 추가하고 "대진 생성"을 눌러주세요.</div>
      <div class="controls">
        <button id="resetBracket">대진 초기화</button>
        <button id="exportJson">JSON 내보내기</button>
      </div>
    </section>
  </main>

  <template id="matchTemplate">
    <div class="match">
      <div class="slot playerA">-</div>
      <div class="vs">vs</div>
      <div class="slot playerB">-</div>
      <div class="scoreInputs">
        <input type="number" class="scoreA" min="0" placeholder="0" />
        <span>:</span>
        <input type="number" class="scoreB" min="0" placeholder="0" />
        <button class="enterResult">입력</button>
      </div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
